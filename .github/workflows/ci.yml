name: E-Commerce API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ecommerce-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecommerce

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt
        
      - name: Initialize database
        run: |
          python -c "from app.database import Base, engine; from app import models; Base.metadata.create_all(bind=engine)"

      - name: Run tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          load: true
          tags: |
           ghcr.io/${{ github.repository_owner }}/ecommerce-api:${{ env.IMAGE_TAG }}
           ghcr.io/${{ github.repository_owner }}/ecommerce-api:latest

      - name: Pull published Docker image
        run: |
         docker pull ghcr.io/${{ github.repository_owner }}/ecommerce-api:${IMAGE_TAG}
         docker tag ghcr.io/${{ github.repository_owner }}/ecommerce-api:${IMAGE_TAG} ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Verify Docker image
        run: |
          docker run --rm ${IMAGE_NAME}:${IMAGE_TAG} \
            python -c "import fastapi,starlette; print('FastAPI:', fastapi.__version__); print('Starlette:', starlette.__version__)"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint helm/ecommerce-api

      - name: Validate Helm templates
        run: |
          helm template ecommerce-api helm/ecommerce-api
          helm template ecommerce-api helm/ecommerce-api --set ingress.enabled=true

      - name: Validate monitoring manifests
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml

          with open("monitoring/servicemonitor.yaml") as file:
              manifest = yaml.safe_load(file)

          assert manifest["apiVersion"] == "monitoring.coreos.com/v1"
          assert manifest["kind"] == "ServiceMonitor"
          assert manifest["metadata"]["name"] == "ecommerce-api"
          assert manifest["metadata"]["namespace"] == "ecommerce"
          assert manifest["spec"]["namespaceSelector"]["matchNames"] == ["ecommerce"]
          assert manifest["spec"]["selector"]["matchLabels"]["app.kubernetes.io/name"] == "ecommerce-api"

          endpoint = manifest["spec"]["endpoints"][0]
          assert endpoint["port"] == "http"
          assert endpoint["path"] == "/metrics"

          print("ServiceMonitor validation passed")
          PY

      - name: Package Helm chart
        run: helm package helm/ecommerce-api

      - name: Run Trivy report scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          args: --timeout 15m

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: error

      - name: Trivy security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          

      - name: Upload Helm chart
        uses: actions/upload-artifact@v7
        with:
          name: ecommerce-api-helm-chart
          path: ecommerce-api-*.tgz
          if-no-files-found: error
